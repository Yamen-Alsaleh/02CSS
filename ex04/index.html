<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Box Model</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Box Model Comparison (Both declared with 300px width)</h2>
    
    <div class="box content-box">
        <h3>Content Box</h3>
        <p>Width = 300px + Padding + Borders</p>
    </div>

    <div class="box border-box">
        <h3>Border Box</h3>
        <p>Width = 300px (Absorbs Padding & Borders)</p>
    </div>
</body>
</html>
