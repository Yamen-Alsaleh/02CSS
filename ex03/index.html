<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors & Opacity</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Color Swatch Palette</h2>
    <div class="swatch named-color">Named (Tomato)</div>
    <div class="swatch hex-color">HEX (#4A90E2)</div>
    <div class="swatch rgb-color">RGB (50, 205, 50)</div>
    <div class="swatch rgba-color">RGBA with Alpha</div>

    <h2>Transparency Comparison</h2>
    <div class="comparison opacity-box">
        <h3>Opacity Property</h3>
        <p>I am faded because opacity cascades to children.</p>
        <button>Faded Button</button>
    </div>

    <div class="comparison rgba-box">
        <h3>RGBA Background Property</h3>
        <p>I am fully visible because only the background is transparent.</p>
        <button>Solid Button</button>
    </div>
</body>
</html>
